name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "31 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    # GitHub withholds code scanning while this repository is private. The
    # cutover procedure enables this switch immediately after publication.
    if: ${{ vars.LIMITLESS_ENABLE_PUBLIC_SECURITY_WORKFLOWS == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:python
