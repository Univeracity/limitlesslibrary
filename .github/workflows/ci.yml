name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Enable unprivileged verifier containment
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'setuptools>=83.0.0'
          python -m pip install '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Static security scan
        run: bandit -r -q src
      - name: Dependency vulnerability scan
        run: pip-audit --local --progress-spinner off
      - name: Test
        run: pytest
      - name: Build
        run: python -m build

  gate:
    name: Verify package
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the complete Python matrix
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$MATRIX_RESULT" = success
