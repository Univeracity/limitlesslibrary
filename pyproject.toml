[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "limitless-library"
version = "0.1.0a0"
description = "Local, fail-closed verified reuse for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Limitless Library"}]
dependencies = [
  "cryptography>=50,<51",
  "jsonschema>=4.18,<5",
]
keywords = ["agents", "mcp", "provenance", "reuse", "verification"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
limitless = "limitless_library.cli:main"
limitless-mcp = "limitless_library.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"limitless_library" = ["py.typed", "official-service-locator.json"]
"limitless_library.conformance" = ["*.json"]
"limitless_library.schemas" = ["*.json"]
"limitless_library.demo_assets" = [
  "authoring/*.json",
  "catalog/*/*.json",
  "catalog/*/payload/*.py",
  "requests/*.json",
  "receiver/*.json",
  "receiver/*.py",
  "receiver/verify/*.py",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
exclude = ["build", "dist"]
line-length = 120
target-version = "py311"
